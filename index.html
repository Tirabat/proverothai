<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="index.js" defer></script>
</head>
<body>
    <h1>Заявки корпуса</h1>
    <ul id="ticketList"></ul>
    <label for="title">Что случилось?</label>
    <input type="text" id="title">
    <label for="room">Где?</label>
    <input type="text" id="room">
    <select id="category">
        <option value="">Выберите категорию</option>
        <option value="1">Оборудование</option>
        <option value="2">Аудитория</option>
        <option value="3">Другое</option>
    </select>
    <button id="complete" type="button">Подать заявку</button>
    <p id="message"></p>
</body>
</html>
